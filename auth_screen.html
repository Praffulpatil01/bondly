<!-- Interactive Layer -->
<script>
        const authToggle = document.getElementById('auth-toggle');
        const toggleText = document.getElementById('toggle-text');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const heading = document.querySelector('h1');
        const subHeading = document.querySelector('p');

        let isLogin = true;

        authToggle.addEventListener('click', () => {
            isLogin = !isLogin;
            
            if (isLogin) {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                authToggle.textContent = 'Sign Up';
                toggleText.textContent = "Don't have an account?";
                heading.textContent = 'Welcome to Bondly';
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                authToggle.textContent = 'Sign In';
                toggleText.textContent = "Already have an account?";
                heading.textContent = 'Create Account';
            }

            // Animate card content
            const container = document.getElementById('auth-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 50);
        });

        // Add visual transition to container
        document.getElementById('auth-container').style.transition = 'all 0.4s ease';

        // Form Submission micro-interaction
        [loginForm, signupForm].forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                const originalContent = btn.innerHTML;
                
                btn.disabled = true;
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...`;
                
                setTimeout(() => {
                    btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success!`;
                    btn.classList.replace('bg-primary', 'bg-tertiary-container');
                    setTimeout(() => {
                        btn.innerHTML = originalContent;
                        btn.disabled = false;
                        btn.classList.replace('bg-tertiary-container', 'bg-primary');
                    }, 2000);
                }, 1500);
            });
        });
    </script>
