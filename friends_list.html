<script>
        function switchTab(tab) {
            const onlineBtn = document.getElementById('tab-online');
            const allBtn = document.getElementById('tab-all');
            
            if (tab === 'online') {
                onlineBtn.classList.add('bg-surface-container-highest', 'text-primary', 'shadow-sm');
                onlineBtn.classList.remove('text-on-surface-variant', 'hover:bg-surface-variant/30');
                allBtn.classList.remove('bg-surface-container-highest', 'text-primary', 'shadow-sm');
                allBtn.classList.add('text-on-surface-variant', 'hover:bg-surface-variant/30');
            } else {
                allBtn.classList.add('bg-surface-container-highest', 'text-primary', 'shadow-sm');
                allBtn.classList.remove('text-on-surface-variant', 'hover:bg-surface-variant/30');
                onlineBtn.classList.remove('bg-surface-container-highest', 'text-primary', 'shadow-sm');
                onlineBtn.classList.add('text-on-surface-variant', 'hover:bg-surface-variant/30');
            }
        }

        // Simple touch swipe simulation for interactive demo
        let startX = 0;
        let currentX = 0;
        let activeSwipe = null;

        document.querySelectorAll('.swipe-container').forEach(container => {
            const content = container.querySelector('.swipe-content');
            
            content.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                activeSwipe = content;
            });

            content.addEventListener('touchmove', (e) => {
                if (!activeSwipe) return;
                currentX = e.touches[0].clientX;
                const diff = currentX - startX;
                if (diff < 0 && diff > -120) {
                    content.style.transform = `translateX(${diff}px)`;
                }
            });

            content.addEventListener('touchend', (e) => {
                if (!activeSwipe) return;
                const diff = currentX - startX;
                if (diff < -60) {
                    content.style.transform = 'translateX(-120px)';
                } else {
                    content.style.transform = 'translateX(0px)';
                }
                activeSwipe = null;
            });
        });

        // Click to open chat micro-interaction
        document.querySelectorAll('.swipe-content').forEach(card => {
            card.addEventListener('mousedown', () => {
                card.style.transform = (card.style.transform === 'translateX(-120px)') ? 'translateX(-120px)' : 'scale(0.98)';
            });
            card.addEventListener('mouseup', () => {
                card.style.transform = (card.style.transform === 'translateX(-120px)') ? 'translateX(-120px)' : 'scale(1)';
            });
        });
    </script>
